[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pylint]
max-line-length = 100

[tool.vulture]
min_confidence = 80
[tool.flake8]
max-line-length = 100

[tool.pyupgrade]

[tool.pylint.'MESSAGES CONTROL']
disable = ["C0114", "C0115", "C0116"]